<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Finance Dashboard · Premium</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  /* Dark Theme (Default) - Deepest Dark */
  body {
    font-family: 'Inter', sans-serif;
    background: #050508;
    color: #ffffff;
    min-height: 100vh;
    transition: all 0.3s ease;
  }
  
  body.light {
    background: #f0f2f8;
    color: #1a1d2e;
  }
  
  /* Glassmorphism Cards - Dark Theme */
  .glass-card {
    background: rgba(10, 12, 18, 0.9);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(108, 99, 255, 0.15);
    border-radius: 24px;
    transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  
  body.light .glass-card {
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(108, 99, 255, 0.2);
  }
  
  .glass-card:hover {
    border-color: rgba(108, 99, 255, 0.4);
    transform: translateY(-4px);
    box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(108, 99, 255, 0.1);
  }
  
  /* KPI Cards */
  .kpi-modern {
    background: linear-gradient(135deg, rgba(10, 12, 18, 0.95), rgba(20, 22, 36, 0.95));
    border: 1px solid rgba(108, 99, 255, 0.2);
    border-radius: 28px;
    padding: 20px 24px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  
  body.light .kpi-modern {
    background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(240,242,248,0.95));
    border: 1px solid rgba(108, 99, 255, 0.3);
  }
  
  .kpi-modern::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(108, 99, 255, 0.1), transparent);
    transition: left 0.6s ease;
  }
  
  .kpi-modern:hover::after {
    left: 100%;
  }
  
  .kpi-icon {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, rgba(108, 99, 255, 0.2), rgba(0, 212, 170, 0.1));
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  
  .kpi-value {
    font-size: 32px;
    font-weight: 800;
    background: linear-gradient(135deg, #fff, rgba(108, 99, 255, 0.8));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  body.light .kpi-value {
    background: linear-gradient(135deg, #1a1d2e, #6c63ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  
  /* Chart Containers */
  .chart-container {
    background: rgba(10, 12, 18, 0.8);
    border-radius: 24px;
    padding: 20px;
    transition: all 0.3s ease;
  }
  
  body.light .chart-container {
    background: rgba(255, 255, 255, 0.8);
  }
  
  .chart-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 16px;
  }
  
  body.light .chart-title {
    color: rgba(0,0,0,0.5);
  }
  
  /* Modern Table */
  .modern-table {
    width: 100%;
    border-collapse: collapse;
  }
  
  .modern-table th {
    text-align: left;
    padding: 14px 16px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.5);
    border-bottom: 1px solid rgba(108, 99, 255, 0.2);
  }
  
  body.light .modern-table th {
    color: rgba(0,0,0,0.5);
    border-bottom: 1px solid rgba(108, 99, 255, 0.3);
  }
  
  .modern-table td {
    padding: 14px 16px;
    font-size: 13px;
    font-weight: 500;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    transition: all 0.2s ease;
    color: #e0e0e0;
  }
  
  body.light .modern-table td {
    border-bottom: 1px solid rgba(0,0,0,0.05);
    color: #1a1d2e;
  }
  
  .modern-table tr:hover td {
    background: rgba(108, 99, 255, 0.08);
  }
  
  /* Navbar */
  .navbar-premium {
    background: rgba(5, 5, 8, 0.95);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(108, 99, 255, 0.2);
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  
  body.light .navbar-premium {
    background: rgba(255, 255, 255, 0.95);
    border-bottom: 1px solid rgba(108, 99, 255, 0.3);
  }
  
  .logo {
    font-size: 20px;
    font-weight: 800;
    background: linear-gradient(135deg, #6c63ff, #00d4aa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  
  .nav-tab {
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.5);
    padding: 8px 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 40px;
  }
  
  body.light .nav-tab {
    color: rgba(0,0,0,0.5);
  }
  
  .nav-tab:hover {
    color: #6c63ff;
    background: rgba(108, 99, 255, 0.1);
  }
  
  .nav-tab.active {
    color: #6c63ff;
    background: linear-gradient(135deg, rgba(108, 99, 255, 0.2), rgba(0, 212, 170, 0.1));
    border: 1px solid rgba(108, 99, 255, 0.3);
  }
  
  /* Controls - Dark Dropdowns Fixed */
  .controls-modern {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  
  .select-modern {
    background: #1a1d2e;
    border: 1px solid rgba(108, 99, 255, 0.3);
    border-radius: 40px;
    padding: 10px 20px;
    color: #ffffff;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  
  .select-modern option {
    background: #1a1d2e;
    color: #ffffff;
  }
  
  body.light .select-modern {
    background: #ffffff;
    color: #1a1d2e;
    border: 1px solid rgba(108, 99, 255, 0.5);
  }
  
  body.light .select-modern option {
    background: #ffffff;
    color: #1a1d2e;
  }
  
  .select-modern:hover {
    border-color: #6c63ff;
    background: rgba(108, 99, 255, 0.1);
  }
  
  body.light .select-modern:hover {
    background: rgba(108, 99, 255, 0.05);
  }
  
  input.select-modern {
    background: #1a1d2e;
    color: #ffffff;
  }
  
  body.light input.select-modern {
    background: #ffffff;
    color: #1a1d2e;
  }
  
  .btn-modern {
    background: linear-gradient(135deg, #6c63ff, #5046e5);
    border: none;
    border-radius: 40px;
    padding: 10px 24px;
    color: white;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.3s;
  }
  
  .btn-modern:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(108, 99, 255, 0.3);
  }
  
  .btn-outline {
    background: transparent;
    border: 1px solid rgba(108, 99, 255, 0.5);
    border-radius: 40px;
    padding: 10px 24px;
    color: rgba(255,255,255,0.8);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.3s;
  }
  
  body.light .btn-outline {
    color: rgba(0,0,0,0.8);
  }
  
  .btn-outline:hover {
    border-color: #6c63ff;
    background: rgba(108, 99, 255, 0.1);
  }
  
  /* Page transitions */
  .page {
    display: none;
    padding: 32px;
    animation: fadeInUp 0.5s ease;
  }
  
  .page.active {
    display: block;
  }
  
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  /* Grid layouts */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    margin-bottom: 32px;
  }
  
  .charts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
    gap: 24px;
    margin-bottom: 32px;
  }
  
  @media (max-width: 900px) {
    .charts-grid { grid-template-columns: 1fr; }
    .page { padding: 20px; }
    .navbar-premium { padding: 12px 20px; }
  }
  
  /* Risk badges */
  .risk-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 40px;
    font-size: 11px;
    font-weight: 600;
  }
  
  .risk-high { background: rgba(255, 107, 107, 0.15); color: #ff6b6b; border: 1px solid rgba(255, 107, 107, 0.3); }
  .risk-medium { background: rgba(255, 201, 77, 0.15); color: #ffc94d; border: 1px solid rgba(255, 201, 77, 0.3); }
  .risk-processing { background: rgba(0, 212, 170, 0.15); color: #00d4aa; border: 1px solid rgba(0, 212, 170, 0.3); }
  
  .status-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 40px;
    font-size: 11px;
    font-weight: 600;
  }
  
  .status-paid { background: rgba(0, 212, 170, 0.15); color: #00d4aa; }
  .status-pending { background: rgba(255, 201, 77, 0.15); color: #ffc94d; }
  .status-followup { background: rgba(108, 99, 255, 0.15); color: #6c63ff; }
  .status-disputed { background: rgba(255, 107, 107, 0.15); color: #ff6b6b; }
  
  /* Setup panel */
  .setup-panel {
    max-width: 600px;
    margin: 60px auto;
    text-align: center;
  }
  
  .setup-panel input {
    width: 100%;
    background: #1a1d2e;
    border: 1px solid rgba(108, 99, 255, 0.3);
    border-radius: 12px;
    padding: 14px 18px;
    color: white;
    margin-top: 8px;
  }
  
  body.light .setup-panel input {
    background: #ffffff;
    color: #1a1d2e;
  }
  
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: linear-gradient(135deg, #00d4aa, #6c63ff);
    padding: 12px 24px;
    border-radius: 40px;
    font-weight: 600;
    z-index: 1000;
    animation: slideIn 0.3s ease;
  }
  
  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  
  /* Chart text colors */
  canvas {
    max-height: 300px;
    width: 100%;
  }
</style>
</head>
<body>

<nav class="navbar-premium">
  <div class="logo">Finance<span style="color:#6c63ff">Pulse</span></div>
  <div style="display: flex; gap: 8px;">
    <button class="nav-tab active" onclick="showPage('recovery')">Recovery</button>
    <button class="nav-tab" onclick="showPage('outstanding')">Outstanding</button>
    <button class="nav-tab" onclick="showPage('config')">Config</button>
  </div>
  <button class="btn-outline" onclick="toggleTheme()" style="padding: 6px 16px;">🌓 Theme</button>
</nav>

<!-- Recovery Page -->
<div class="page active" id="page-recovery">
  <div id="setup-recovery" style="display: none;">
    <div class="setup-panel glass-card" style="padding: 48px;">
      <h2 style="margin-bottom: 16px;">📊 Connect Your Data</h2>
      <p style="color: rgba(255,255,255,0.6); margin-bottom: 24px;">Paste your Google Sheets CSV URLs below</p>
      <input type="text" id="recovery-url" placeholder="Recovery Tab CSV URL">
      <input type="text" id="outstanding-url" placeholder="Outstanding Tab CSV URL" style="margin-top: 16px;">
      <div style="display: flex; gap: 12px; margin-top: 24px;">
        <button class="btn-modern" onclick="loadFromURLs()">Load Data</button>
        <button class="btn-outline" onclick="loadDemo()">Load Demo</button>
      </div>
    </div>
  </div>

  <div id="recovery-dash">
    <div class="controls-modern">
      <select id="rec-month" class="select-modern"></select>
      <select id="rec-year" class="select-modern"></select>
      <input type="number" id="rec-topn" class="select-modern" style="width: 100px;" value="10">
      <button class="btn-modern" onclick="renderRecovery()">Apply</button>
      <button class="btn-outline" onclick="showSetup()">Change Source</button>
    </div>

    <div class="kpi-grid" id="recovery-kpis"></div>
    <div class="charts-grid">
      <div class="chart-container"><div class="chart-title">📊 TOP CUSTOMERS — RECOVERED</div><canvas id="barChart"></canvas></div>
      <div class="chart-container"><div class="chart-title">🥧 RECOVERY SHARE</div><canvas id="donutChart"></canvas></div>
    </div>
    <div class="glass-card" style="padding: 24px; overflow-x: auto;">
      <table class="modern-table">
        <thead><tr><th>#</th><th>Customer</th><th>Amount Recovered</th><th>Invoice #</th><th>Bank</th></tr></thead>
        <tbody id="rec-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Outstanding Page -->
<div class="page" id="page-outstanding">
  <div class="controls-modern">
    <input type="text" id="out-search" class="select-modern" placeholder="Search customer..." style="width: 200px;" oninput="renderOutstanding()">
    <select id="out-risk" class="select-modern" onchange="renderOutstanding()">
      <option value="">All Risks</option><option value="high">⚠️ High Risk</option><option value="medium">🟡 Medium Risk</option><option value="processing">🟢 Processing</option>
    </select>
    <select id="out-sales" class="select-modern" onchange="renderOutstanding()"></select>
    <select id="out-status" class="select-modern" onchange="renderOutstanding()"></select>
  </div>

  <div class="kpi-grid" id="outstanding-kpis"></div>
  <div class="charts-grid">
    <div class="chart-container"><div class="chart-title">⚠️ RISK BREAKDOWN</div><canvas id="riskDonut"></canvas></div>
    <div class="chart-container"><div class="chart-title">🏆 TOP 10 CUSTOMERS (DR)</div><canvas id="outBar"></canvas></div>
  </div>
  <div class="glass-card" style="padding: 24px; overflow-x: auto;">
    <table class="modern-table">
      <thead><tr><th>Customer</th><th>Invoice #</th><th>Date</th><th>LPO #</th><th>Dr Amount</th><th>Sales Person</th><th>Risk</th><th>Status</th></tr></thead>
      <tbody id="out-tbody"></tbody>
    </table>
  </div>
</div>

<!-- Config Page -->
<div class="page" id="page-config">
  <div class="glass-card" style="padding: 32px; max-width: 800px; margin: 0 auto;">
    <h3 style="margin-bottom: 24px;">⚙ Dashboard Settings</h3>
    <div style="display: flex; flex-direction: column; gap: 20px;">
      <div><label style="color: rgba(255,255,255,0.6);">Recovery CSV URL</label><input type="text" id="cfg-rec-url" class="select-modern" style="width: 100%; margin-top: 8px;"></div>
      <div><label style="color: rgba(255,255,255,0.6);">Outstanding CSV URL</label><input type="text" id="cfg-out-url" class="select-modern" style="width: 100%; margin-top: 8px;"></div>
      <div><label style="color: rgba(255,255,255,0.6);">High Risk Before (Month)</label><input type="month" id="cfg-high-before" class="select-modern" style="margin-top: 8px;"></div>
      <div><label style="color: rgba(255,255,255,0.6);">Medium Risk Before (Month)</label><input type="month" id="cfg-med-before" class="select-modern" style="margin-top: 8px;"></div>
      <div><label style="color: rgba(255,255,255,0.6);">Processing From (Month)</label><input type="month" id="cfg-proc-from" class="select-modern" style="margin-top: 8px;"></div>
      <div><label style="color: rgba(255,255,255,0.6);">Currency Symbol</label><input type="text" id="cfg-currency" class="select-modern" style="margin-top: 8px;" value="AED"></div>
      <button class="btn-modern" onclick="saveConfig()">Save Settings</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" style="display: none;">✓ Saved</div>

<script>
// ============================================================
// STATE & DATA
// ============================================================
let recoveryData = [];
let outstandingData = [];
let barChart, donutChart, riskDonut, outBar;
let cfg = {
  recUrl: '', outUrl: '',
  highBefore: '2026-01', medBefore: '2026-03', procFrom: '2026-03',
  topN: 10, currency: 'AED'
};

// ============================================================
// DATE PARSER - Fixed for "5-Feb-2026" format
// ============================================================
function parseDate(str) {
  if (!str) return null;
  
  let s = String(str).trim();
  
  const months = { 'jan':0, 'feb':1, 'mar':2, 'apr':3, 'may':4, 'jun':5,
                   'jul':6, 'aug':7, 'sep':8, 'oct':9, 'nov':10, 'dec':11 };
  
  let match = s.match(/(\d{1,2})[-\/](jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[-\/](\d{4})/i);
  if (match) {
    let day = parseInt(match[1]);
    let month = months[match[2].toLowerCase()];
    let year = parseInt(match[3]);
    if (!isNaN(day) && month !== undefined && !isNaN(year)) {
      return new Date(year, month, day);
    }
  }
  
  match = s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if (match) {
    return new Date(parseInt(match[1]), parseInt(match[2])-1, parseInt(match[3]));
  }
  
  match = s.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
  if (match) {
    return new Date(parseInt(match[3]), parseInt(match[2])-1, parseInt(match[1]));
  }
  
  let d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function parseAmount(val) {
  if (!val) return 0;
  if (typeof val === 'number') return val;
  let num = String(val).replace(/,/g, '').replace(/[^0-9.-]/g, '');
  return parseFloat(num) || 0;
}

function formatCurrency(amt) {
  return cfg.currency + ' ' + Math.round(amt).toLocaleString();
}

// ============================================================
// RENDER FUNCTIONS
// ============================================================
function renderKPIs(data, containerId, options = {}) {
  const container = document.getElementById(containerId);
  if (!container) return;
  
  const total = data.reduce((s, r) => s + parseAmount(r[options.amountField] || 0), 0);
  const count = data.length;
  const avg = count ? total / count : 0;
  const topCustomer = data.reduce((best, r) => {
    const amt = parseAmount(r[options.amountField] || 0);
    return amt > best.amt ? { name: r[options.nameField] || 'Unknown', amt } : best;
  }, { name: '—', amt: 0 });
  
  container.innerHTML = `
    <div class="kpi-modern"><div style="display: flex; justify-content: space-between; align-items: flex-start;"><div><div class="kpi-icon">💰</div><div style="margin-top: 16px;"><div class="kpi-value">${formatCurrency(total)}</div><div style="font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px;">Total ${options.label || 'Recovered'}</div></div></div></div></div>
    <div class="kpi-modern"><div style="display: flex; justify-content: space-between; align-items: flex-start;"><div><div class="kpi-icon">📋</div><div style="margin-top: 16px;"><div class="kpi-value">${count.toLocaleString()}</div><div style="font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px;">Transactions</div></div></div></div></div>
    <div class="kpi-modern"><div style="display: flex; justify-content: space-between; align-items: flex-start;"><div><div class="kpi-icon">🏆</div><div style="margin-top: 16px;"><div class="kpi-value" style="font-size: 18px;">${(topCustomer.name || '—').substring(0, 20)}</div><div style="font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px;">${formatCurrency(topCustomer.amt)}</div></div></div></div></div>
    <div class="kpi-modern"><div style="display: flex; justify-content: space-between; align-items: flex-start;"><div><div class="kpi-icon">📊</div><div style="margin-top: 16px;"><div class="kpi-value">${formatCurrency(avg)}</div><div style="font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px;">Average per Transaction</div></div></div></div></div>
  `;
}

function initRecovery() {
  if (!recoveryData.length) return;
  
  const years = [...new Set(recoveryData.map(r => {
    let d = parseDate(r['Recovery Date'] || r['DateFormated']);
    return d ? d.getFullYear() : null;
  }).filter(Boolean))].sort((a,b)=>b-a);
  
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  
  let yearSelect = document.getElementById('rec-year');
  let monthSelect = document.getElementById('rec-month');
  
  if (yearSelect) yearSelect.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');
  if (monthSelect) monthSelect.innerHTML = monthNames.map((m, i) => `<option value="${i+1}">${m}</option>`).join('');
  
  renderRecovery();
}

function renderRecovery() {
  if (!recoveryData.length) return;
  
  const month = parseInt(document.getElementById('rec-month')?.value || new Date().getMonth()+1);
  const year = parseInt(document.getElementById('rec-year')?.value || new Date().getFullYear());
  const topN = parseInt(document.getElementById('rec-topn')?.value || 10);
  
  const filtered = recoveryData.filter(r => {
    const d = parseDate(r['Recovery Date'] || r['DateFormated']);
    return d && d.getMonth()+1 === month && d.getFullYear() === year;
  });
  
  renderKPIs(filtered, 'recovery-kpis', { amountField: 'Amount Recovered', nameField: 'Client / Account Name', label: 'Recovered' });
  
  const customerMap = new Map();
  filtered.forEach(r => {
    let name = r['Client / Account Name'] || 'Unknown';
    let amt = parseAmount(r['Amount Recovered']);
    customerMap.set(name, (customerMap.get(name) || 0) + amt);
  });
  
  const sorted = [...customerMap.entries()].sort((a,b) => b[1] - a[1]).slice(0, topN);
  const colors = ['#6c63ff', '#00d4aa', '#ffc94d', '#ff6b6b', '#4ecdc4', '#a29bfe', '#55efc4', '#fdcb6e'];
  
  if (barChart) barChart.destroy();
  barChart = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: { labels: sorted.map(s => s[0].length > 20 ? s[0].substring(0,17)+'…' : s[0]), datasets: [{ data: sorted.map(s => s[1]), backgroundColor: colors, borderRadius: 12, barPercentage: 0.6 }] },
    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => `${formatCurrency(ctx.raw)}` } } }, scales: { x: { ticks: { color: '#aaa' }, grid: { display: false } }, y: { ticks: { color: '#aaa', callback: v => formatCurrency(v) } } } }
  });
  
  if (donutChart) donutChart.destroy();
  donutChart = new Chart(document.getElementById('donutChart'), {
    type: 'doughnut',
    data: { labels: sorted.map(s => s[0].substring(0, 20)), datasets: [{ data: sorted.map(s => s[1]), backgroundColor: colors, borderWidth: 0, hoverOffset: 8 }] },
    options: { responsive: true, maintainAspectRatio: true, cutout: '60%', plugins: { legend: { position: 'right', labels: { color: '#aaa', font: { size: 11 } } }, tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${formatCurrency(ctx.raw)}` } } } }
  });
  
  let tbody = document.getElementById('rec-tbody');
  tbody.innerHTML = sorted.map(([name, amt], i) => {
    let sampleInvoice = filtered.find(r => r['Client / Account Name'] === name);
    return `<tr><td style="color: #6c63ff; font-weight: 700;">#${i+1}</td><td style="font-weight: 500;">${name}</td><td style="font-weight: 600;">${formatCurrency(amt)}</td><td style="color: #aaa;">${sampleInvoice?.['Invoice #'] || '—'}</td><td style="color: #aaa;">${sampleInvoice?.['Bank'] || '—'}</td></tr>`;
  }).join('');
}

function initOutstanding() {
  if (!outstandingData.length) return;
  
  let sales = [...new Set(outstandingData.map(r => r['Sales Person']).filter(Boolean))];
  let statuses = [...new Set(outstandingData.map(r => r['Status'] || r['Status / Remarks']).filter(Boolean))];
  
  document.getElementById('out-sales').innerHTML = '<option value="">All Sales</option>' + sales.map(s => `<option>${s}</option>`).join('');
  document.getElementById('out-status').innerHTML = '<option value="">All Status</option>' + statuses.map(s => `<option>${s}</option>`).join('');
  
  renderOutstanding();
}

function getRisk(invoiceDate) {
  let d = parseDate(invoiceDate);
  if (!d) return 'processing';
  let ym = d.getFullYear() * 100 + (d.getMonth()+1);
  let highCut = parseInt(cfg.highBefore.replace('-', ''));
  let medCut = parseInt(cfg.medBefore.replace('-', ''));
  if (ym < highCut) return 'high';
  if (ym < medCut) return 'medium';
  return 'processing';
}

function renderOutstanding() {
  if (!outstandingData.length) return;
  
  let search = (document.getElementById('out-search')?.value || '').toLowerCase();
  let riskFilter = document.getElementById('out-risk')?.value || '';
  let salesFilter = document.getElementById('out-sales')?.value || '';
  let statusFilter = document.getElementById('out-status')?.value || '';
  
  let filtered = outstandingData.filter(r => {
    let name = (r['Customer Name'] || '').toLowerCase();
    let inv = (r['Invoice #'] || '').toLowerCase();
    if (search && !name.includes(search) && !inv.includes(search)) return false;
    let risk = getRisk(r['Invoice Date']);
    if (riskFilter && risk !== riskFilter) return false;
    if (salesFilter && r['Sales Person'] !== salesFilter) return false;
    let st = r['Status'] || r['Status / Remarks'] || '';
    if (statusFilter && st !== statusFilter) return false;
    return true;
  });
  
  renderKPIs(filtered, 'outstanding-kpis', { amountField: 'Dr', nameField: 'Customer Name', label: 'Outstanding' });
  
  let riskData = { high: 0, medium: 0, processing: 0 };
  filtered.forEach(r => { let amt = parseAmount(r['Dr']); riskData[getRisk(r['Invoice Date'])] += amt; });
  
  if (riskDonut) riskDonut.destroy();
  riskDonut = new Chart(document.getElementById('riskDonut'), {
    type: 'doughnut', data: { labels: ['High Risk', 'Medium Risk', 'Processing'], datasets: [{ data: [riskData.high, riskData.medium, riskData.processing], backgroundColor: ['#ff6b6b', '#ffc94d', '#00d4aa'], borderWidth: 0 }] },
    options: { responsive: true, maintainAspectRatio: true, cutout: '60%', plugins: { legend: { position: 'right', labels: { color: '#aaa' } }, tooltip: { callbacks: { label: (ctx) => `${formatCurrency(ctx.raw)}` } } } }
  });
  
  let custMap = new Map();
  filtered.forEach(r => { let name = r['Customer Name'] || 'Unknown'; custMap.set(name, (custMap.get(name) || 0) + parseAmount(r['Dr'])); });
  let topCust = [...custMap.entries()].sort((a,b) => b[1] - a[1]).slice(0, 10);
  
  if (outBar) outBar.destroy();
  outBar = new Chart(document.getElementById('outBar'), {
    type: 'bar', data: { labels: topCust.map(c => c[0].length > 15 ? c[0].substring(0,12)+'…' : c[0]), datasets: [{ data: topCust.map(c => c[1]), backgroundColor: '#6c63ff', borderRadius: 12 }] },
    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => formatCurrency(ctx.raw) } } }, scales: { x: { ticks: { color: '#aaa' }, grid: { display: false } }, y: { ticks: { color: '#aaa', callback: v => formatCurrency(v) } } } }
  });
  
  let tbody = document.getElementById('out-tbody');
  tbody.innerHTML = filtered.map(r => {
    let risk = getRisk(r['Invoice Date']);
    let riskClass = risk === 'high' ? 'risk-high' : risk === 'medium' ? 'risk-medium' : 'risk-processing';
    let riskText = risk === 'high' ? '⚠️ High' : risk === 'medium' ? '🟡 Medium' : '🟢 Processing';
    let status = r['Status'] || r['Status / Remarks'] || '—';
    let statusClass = status.toLowerCase().includes('paid') ? 'status-paid' : 
                      status.toLowerCase().includes('follow') ? 'status-followup' :
                      status.toLowerCase().includes('dispute') ? 'status-disputed' : 'status-pending';
    return `<tr><td style="font-weight: 500;">${r['Customer Name']||'—'}</td><td style="color: #aaa;">${r['Invoice #']||'—'}</td><td style="color: #aaa;">${r['Invoice Date']||'—'}</td><td style="color: #aaa;">${r['LPO #']||'—'}</td><td style="font-weight: 600;">${formatCurrency(parseAmount(r['Dr']))}</td><td style="color: #aaa;">${r['Sales Person']||'—'}</td><td><span class="risk-badge ${riskClass}">${riskText}</span></td><td><span class="status-badge ${statusClass}">${status}</span></td></tr>`;
  }).join('');
}

// ============================================================
// DATA LOADING
// ============================================================
function loadDemo() {
  // Demo data with REAL values
  const demoRecovery = [];
  const demoOutstanding = [];
  
  const realCustomers = ['Al Futtaim Group', 'Emirates NBD', 'Mashreq Bank', 'ADNOC', 'Emaar Properties', 'Etisalat', 'DP World', 'Majid Al Futtaim'];
  const realSales = ['Ahmed Al Mansoori', 'Sara Khan', 'Ravi Patel', 'Fatima Al Zaabi'];
  const realStatuses = ['Paid', 'Pending', 'Follow Up', 'Disputed'];
  
  for (let i = 1; i <= 50; i++) {
    let customer = realCustomers[i % realCustomers.length];
    let amount = Math.floor(Math.random() * 50000 + 5000);
    let day = Math.floor(Math.random() * 28) + 1;
    let month = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'][Math.floor(Math.random() * 6)];
    
    demoRecovery.push({ 
      'Client / Account Name': customer, 
      'Amount Recovered': amount, 
      'Recovery Date': `${day}-${month}-2026`, 
      'Invoice #': `INV-${10000 + i}`,
      'Bank': ['ENBD', 'FAB', 'ADCB', 'Mashreq'][i % 4]
    });
    
    demoOutstanding.push({ 
      'Customer Name': customer, 
      'Invoice #': `INV-${20000 + i}`, 
      'Invoice Date': `${day}-${month}-2026`, 
      'LPO #': `LPO-${5000 + i}`, 
      'Dr': Math.floor(Math.random() * 30000 + 2000), 
      'Sales Person': realSales[i % realSales.length], 
      'Status': realStatuses[i % realStatuses.length],
      'Status / Remarks': realStatuses[i % realStatuses.length]
    });
  }
  
  recoveryData = demoRecovery;
  outstandingData = demoOutstanding;
  initRecovery();
  initOutstanding();
  hidSetup();
  showToast('Demo data loaded');
}

function loadFromURLs() {
  let recUrl = document.getElementById('recovery-url')?.value;
  let outUrl = document.getElementById('outstanding-url')?.value;
  if (recUrl) {
    Papa.parse(recUrl, { download: true, header: true, complete: (res) => { recoveryData = res.data; initRecovery(); hidSetup(); showToast('Recovery data loaded'); } });
  }
  if (outUrl) {
    Papa.parse(outUrl, { download: true, header: true, complete: (res) => { outstandingData = res.data; initOutstanding(); showToast('Outstanding data loaded'); } });
  }
}

function saveConfig() {
  cfg.recUrl = document.getElementById('cfg-rec-url')?.value || cfg.recUrl;
  cfg.outUrl = document.getElementById('cfg-out-url')?.value || cfg.outUrl;
  cfg.highBefore = document.getElementById('cfg-high-before')?.value || cfg.highBefore;
  cfg.medBefore = document.getElementById('cfg-med-before')?.value || cfg.medBefore;
  cfg.procFrom = document.getElementById('cfg-proc-from')?.value || cfg.procFrom;
  cfg.currency = document.getElementById('cfg-currency')?.value || cfg.currency;
  localStorage.setItem('fpCfg', JSON.stringify(cfg));
  renderRecovery();
  renderOutstanding();
  showToast('Settings saved');
}

function showToast(msg) {
  let toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.style.display = 'block';
  setTimeout(() => toast.style.display = 'none', 2000);
}

function showPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(`page-${page}`).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  if (event && event.target) event.target.classList.add('active');
}

function showSetup() {
  document.getElementById('setup-recovery').style.display = 'block';
  document.getElementById('recovery-dash').style.display = 'none';
}

function hidSetup() {
  document.getElementById('setup-recovery').style.display = 'none';
  document.getElementById('recovery-dash').style.display = 'block';
}

function toggleTheme() {
  document.body.classList.toggle('light');
  let isLight = document.body.classList.contains('light');
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
  // Redraw charts to update colors
  if (recoveryData.length) renderRecovery();
  if (outstandingData.length) renderOutstanding();
}

// Load saved config and theme
try { 
  let saved = localStorage.getItem('fpCfg'); 
  if (saved) cfg = { ...cfg, ...JSON.parse(saved) }; 
} catch(e) {}

let savedTheme = localStorage.getItem('theme');
if (savedTheme === 'light') document.body.classList.add('light');

document.getElementById('cfg-high-before').value = cfg.highBefore;
document.getElementById('cfg-med-before').value = cfg.medBefore;
document.getElementById('cfg-proc-from').value = cfg.procFrom;
document.getElementById('cfg-currency').value = cfg.currency;
if (cfg.recUrl) document.getElementById('cfg-rec-url').value = cfg.recUrl;
if (cfg.outUrl) document.getElementById('cfg-out-url').value = cfg.outUrl;

loadDemo();
</script>
